<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>星陨</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/theme.css">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="clock">
      <b id="clockTime">0:00</b>
      <span id="clockNext">下一波 20s</span>
    </div>
    <div id="topbar">
      <div class="bar-row">
        <span class="tag">装甲</span>
        <div class="track"><div class="fill" id="hpFill"></div></div>
        <span class="val" id="hpHp">150/150</span>
      </div>
      <div class="bar-row">
        <span class="tag">同步</span>
        <div class="track slim"><div class="fill" id="xpFill"></div></div>
        <span class="val" id="xpVal">0%</span>
      </div>
      <div id="stats">
        <span><i>型号</i><b id="sLv">Mk-I</b></span>
        <span><i>波次</i><b id="sWave">1</b></span>
        <span><i>击毁</i><b id="sKill">0</b></span>
        <span title="局内信用点 · 按 B 打开补给终端"><i>信用点</i><b id="sCredit" class="warn">0</b></span>
        <span><i>视角</i><b id="sZoom">1.0×</b></span>
      </div>
      <div id="loadout"></div>
    </div>
    <div id="combo"></div>
  </div>

  <div id="overlay"><div id="panel"></div></div>
  <div id="vignette"></div>

  <div id="pause" class="hidden">
    <div class="box">
      <h2 id="pauseTitle">已暂停</h2>
      <p class="sub">ESC 继续 · 点一下画面也可以 · M 切换音效（<span id="muteState">开</span>）· R 重开本局</p>
      <div class="qrow">
        <span class="qlabel">画质</span>
        <button class="chip q" data-q="high">高</button>
        <button class="chip q" data-q="mid">中</button>
        <button class="chip q" data-q="low">低</button>
      </div>
      <button class="btn alt" id="fbPause">意见收集 · 反馈 Bug 或建议</button>
    </div>
  </div>

  <!-- 右下角常驻按钮条：桌面显示"意见"，触摸设备额外显示 补给 / 暂停 / 全屏
       （手机没有键盘，B 和 ESC 都按不到 —— 少了这两个按钮，商店和暂停在手机上是打不开的） -->
  <div id="cornerbar">
    <button id="shopBtn" class="touchonly" title="补给终端（B）">补给 <b id="shopCredits">0</b></button>
    <button id="pauseBtn" class="touchonly" title="暂停（ESC）">❚❚</button>
    <button id="fsBtn" class="touchonly" title="全屏">⛶</button>
    <button id="fbCorner" title="意见收集：报 Bug / 提建议（自动附带诊断信息）">意见</button>
  </div>

  <div id="hint">WASD / 方向键机动 · 自动开火 · B 补给终端 · 滚轮或 −/= 调镜头高度 · ESC 暂停 · M 静音</div>
  <div id="touchHint">按住屏幕任意位置拖动移动 · 推得越远走得快 · 右下角有 补给 / 暂停</div>
  <!-- 手机竖屏：16:9 舞台只剩一条窄横带，没法玩 —— 提示转屏（同时暂停游戏） -->
  <div id="rotate">
    <div class="rotbox">
      <div class="phone">▭</div>
      <h2>请横屏游玩</h2>
      <p>本作是 16:9 的俯视弹幕战场，竖屏下可视范围不足以躲避弹幕。<br>把手机转成横向即可继续。</p>
    </div>
  </div>
</div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
