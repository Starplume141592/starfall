name: check

# 两个门禁的 CI：武器数值 + 调色板。
# 为什么要有它：`npm run check` 在本地只是"记得跑才有效"——
# 而这个项目出过的几类真实事故（数值表悄悄被改、调色板撞色、文档与代码脱同步）
# 全都是"没人跑自检"时溜进来的。CI 是让验证回路有强制力，不是锦上添花。
#
# ⚠️ 故意**不跑 `npm ci`**：这个项目是零依赖（package.json 没有 dependencies），
#    bench 脚本只用 node 内置模块 + `await import('../src/config.js')`。
#    仓库里那份 package-lock.json 是早期 Phaser 原型的遗留，装了反而可能失败。
#    所以这里直接跑脚本，不碰 node_modules。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 两个门禁各自的**首行**就是结论（✓ / ✗），退出码非零即失败。
      # 拆成两步是为了让 CI 页面上直接看得出**是哪一个**挂了。
      - name: weapons-check（武器数值表）
        run: npm run check:weapons

      - name: palette-check（调色板分带）
        run: npm run check:palette
